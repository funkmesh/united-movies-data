name: Update catalog

# Harvests each airline's catalog (United, American, Delta), enriches new titles
# (OMDb ratings + Wikidata awards + descriptive backfill), and publishes per-airline
# feeds to GitHub Pages — but only redeploys when some feed changed (keeps the ETag
# stable so the app gets cheap 304s). A single airline failing doesn't fail the run.

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch:
  # The app's public pages ship inside the same Pages artifact as the feeds,
  # so editing one has to be able to publish on its own.
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write # open a tracking issue when a catalog's size looks anomalous

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build catalog
        id: build
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: npm run build

      - name: Report catalog size anomalies
        if: steps.build.outputs.has_anomalies == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const anomalies = JSON.parse(fs.readFileSync('dist/anomalies.json', 'utf8'));
            if (!anomalies.length) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rows = anomalies
              .map((a) => `| ${a.displayName} | ${a.count} | ${a.previousCount ?? '—'} | ${a.expectedMin} | ${a.severity} | ${a.reason} |`)
              .join('\n');
            const body = [
              'A scheduled catalog build harvested an airline whose size looks off. This is usually',
              'the source page changing shape or a parser no longer matching (see united-movies#21).',
              '',
              '| Airline | Harvested | Previous | Min expected | Severity | Detail |',
              '| --- | --- | --- | --- | --- | --- |',
              rows,
              '',
              `Build run: ${run}`,
            ].join('\n');
            const title = 'Catalog size anomaly detected';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const open = existing.data.find((i) => i.title === title && !i.pull_request);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
              });
            }

      - name: Upload Pages artifact
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
